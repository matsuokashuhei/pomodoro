[package]
name = "pomodoro"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.40", features = ["rt", "time", "macros"] }
indicatif = "0.17"
notify-rust = "4.11"
rodio = "0.19"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[lib]
name = "pomodoro"
path = "src/lib.rs"

[[bin]]
name = "pomodoro"
path = "src/main.rs"
